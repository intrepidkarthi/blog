<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="orderbook · limit order book and matching engine in Go">
  <style>
    g, path, line, rect, circle, polyline, polygon, ellipse {
      fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
    }
    .g { stroke: #4eff7c; } .a { stroke: #ffb454; } .p { stroke: #ff5f87; } .c { stroke: #5fd7ff; } .d { stroke: #2a8c44; } .pu { stroke: #c780ff; }
    .fg { fill: #4eff7c; stroke: #4eff7c; } .fa { fill: #ffb454; stroke: #ffb454; } .fp { fill: #ff5f87; stroke: #ff5f87; } .fc { fill: #5fd7ff; stroke: #5fd7ff; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #4eff7c; stroke: none; letter-spacing: 1px; }
    .mono-p { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #ff5f87; stroke: none; letter-spacing: 1px; }
    .mono-a { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #ffb454; stroke: none; letter-spacing: 1px; }
    .vt { font-family: 'VT323', monospace; font-size: 16px; fill: #4eff7c; stroke: none; }
  </style>

  <!-- header -->
  <text class="vt" x="18" y="26">$ orderbook</text>

  <!-- mid axis of the ladder -->
  <line class="d" x1="62" y1="38" x2="62" y2="174"/>

  <!-- asks, best at the bottom of the stack -->
  <text class="mono-p" x="18" y="49">100.05</text>
  <rect class="fp" x="66" y="42" width="38" height="8" opacity="0.55"/>
  <text class="mono-p" x="18" y="64">100.04</text>
  <rect class="fp" x="66" y="57" width="66" height="8" opacity="0.7"/>
  <text class="mono-p" x="18" y="79">100.03</text>
  <rect class="fp" x="66" y="72" width="32" height="8" opacity="0.85"/>
  <text class="mono-p" x="18" y="94">100.02</text>
  <rect class="fp" x="66" y="87" width="80" height="8"/>

  <!-- the spread -->
  <line class="a" x1="18" y1="101" x2="188" y2="101" stroke-dasharray="4 3" stroke-width="1.6"/>
  <text class="mono-a" x="102" y="113">spread</text>

  <!-- bids, best at the top of the stack -->
  <text class="mono" x="18" y="125">100.01</text>
  <rect class="fg" x="66" y="118" width="88" height="8"/>
  <text class="mono" x="18" y="140">100.00</text>
  <rect class="fg" x="66" y="133" width="54" height="8" opacity="0.85"/>
  <text class="mono" x="18" y="155">99.99</text>
  <rect class="fg" x="66" y="148" width="72" height="8" opacity="0.7"/>
  <text class="mono" x="18" y="170">99.98</text>
  <rect class="fg" x="66" y="163" width="40" height="8" opacity="0.55"/>

  <!-- incoming market order crossing the spread -->
  <path class="c" d="M 184 136 L 184 94 L 160 94" stroke-dasharray="3 3" stroke-width="2"/>
  <path class="c fc" d="M 160 94 L 168 90 L 168 98 Z"/>

  <!-- footer -->
  <text class="mono-a" x="18" y="190">go · p50 83ns · 0 B/op</text>
</svg>
