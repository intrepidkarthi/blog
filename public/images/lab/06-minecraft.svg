<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="minecrAft · Adyah's voxel world">
  <style>
    g, path, line, rect, polygon, polyline { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .g { stroke: #4eff7c; } .a { stroke: #ffb454; } .p { stroke: #ff5f87; } .c { stroke: #5fd7ff; } .d { stroke: #2a8c44; }
    .fg { fill: #4eff7c; stroke: #4eff7c; } .fa { fill: #ffb454; stroke: #ffb454; } .fp { fill: #ff5f87; stroke: #ff5f87; } .fc { fill: #5fd7ff; stroke: #5fd7ff; } .fd { fill: #2a8c44; stroke: #2a8c44; }
    .ft-top { fill: #4eff7c; opacity: 0.35; stroke: #4eff7c; }
    .ft-left { fill: #2a8c44; opacity: 0.45; stroke: #4eff7c; }
    .ft-right { fill: #2a8c44; opacity: 0.25; stroke: #4eff7c; }
    .ft-top-a { fill: #ffb454; opacity: 0.35; stroke: #ffb454; }
    .ft-left-a { fill: #ffb454; opacity: 0.55; stroke: #ffb454; }
    .ft-right-a { fill: #ffb454; opacity: 0.25; stroke: #ffb454; }
    .ft-top-p { fill: #ff5f87; opacity: 0.35; stroke: #ff5f87; }
    .ft-left-p { fill: #ff5f87; opacity: 0.55; stroke: #ff5f87; }
    .ft-right-p { fill: #ff5f87; opacity: 0.25; stroke: #ff5f87; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #4eff7c; stroke: none; letter-spacing: 1px; }
    .mono-a { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #ffb454; stroke: none; letter-spacing: 1px; }
  </style>

  <!-- ground line -->
  <line class="d" x1="20" y1="160" x2="180" y2="160" stroke-dasharray="2 4"/>

  <!-- isometric cube 1 (green, bottom-left, base) -->
  <polygon class="ft-top"    points="60,110  90,95  120,110  90,125"/>
  <polygon class="ft-left"   points="60,110  90,125  90,160  60,145"/>
  <polygon class="ft-right"  points="120,110 90,125  90,160  120,145"/>

  <!-- isometric cube 2 (amber, middle, raised) -->
  <polygon class="ft-top-a"    points="95,80  125,65 155,80  125,95"/>
  <polygon class="ft-left-a"   points="95,80  125,95  125,130 95,115"/>
  <polygon class="ft-right-a"  points="155,80 125,95  125,130 155,115"/>

  <!-- isometric cube 3 (pink, top, star block) -->
  <polygon class="ft-top-p"    points="70,50   95,38 120,50   95,62"/>
  <polygon class="ft-left-p"   points="70,50   95,62  95,90   70,78"/>
  <polygon class="ft-right-p"  points="120,50  95,62  95,90  120,78"/>

  <!-- star sparkle on the pink block -->
  <path class="fa" d="M 95 47 L 96.5 51 L 100.5 51.5 L 97.5 54 L 98.5 58 L 95 56 L 91.5 58 L 92.5 54 L 89.5 51.5 L 93.5 51 Z"/>

  <!-- labels -->
  <text class="mono-a" x="100" y="22" text-anchor="middle">▲ /minecraft</text>
  <text class="mono" x="22" y="180">voxel · Adyah's world</text>
</svg>
